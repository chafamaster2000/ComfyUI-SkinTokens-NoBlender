[project]
name = "comfyui-skintokens-noblender"
version = "1.0.0"
description = "Auto-rig a static mesh into a skinned .glb (skeleton + weights) - fully pure-Python glb I/O, no Blender/bpy subprocess, plus Mixamo/UE5 relabel, texture transfer, voxel post-process, and skin-weight cleanup."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Runtime deps are tracked in requirements.txt (ComfyUI Manager reads that).
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/stevelittlefish/ComfyUI-SkinTokens-NoBlender"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["skintokens*"]

[tool.setuptools.package-data]
"skintokens.vendor" = ["configs/skeleton/*.yaml"]

# --- ComfyUI Manager / registry metadata ---
[tool.comfy]
PublisherId = "stevelittlefish"
DisplayName = "ComfyUI-SkinTokens-NoBlender"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "server: tests that need the GPU + full model weights (run on the server; see scripts/server/)",
]
